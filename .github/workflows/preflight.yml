name: Spatial HDMI preflight (no Unity license)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spatial-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source parsers
        run: python -m pip install -r tools/requirements-syntax.txt
      - name: Validate source contracts and C#/Java syntax
        run: |
          python tools/validate.py
          python tools/check_syntax.py
          python -m unittest discover -s tests -v
          bash -n tools/prepare-project.sh tools/prepare-project-uba.sh
      - name: Install video inspection tool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Decode entire bundled video and audio
        run: |
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height -show_entries format=duration -of json Overlay/Assets/StreamingAssets/demo.mp4
          ffmpeg -v error -xerror -i Overlay/Assets/StreamingAssets/demo.mp4 -f null -
      - name: Assemble official Unity XR base using UBA hook context
        run: |
          mkdir -p Base
          cd Base
          bash ../tools/prepare-project-uba.sh
      - name: Check real assembled dependency and XR configuration
        run: |
          python tools/check_project.py Base
          python -m unittest discover -s tests -p test_project_contract.py -v
